# nginx site for the landing: /etc/nginx/sites-available/vprodcrm.ru on the server
# (enabled via a symlink in sites-enabled). Kept here for history; CI does not deploy it.
# Apply by hand: copy to the server, `sudo nginx -t`, `sudo systemctl reload nginx`.
#
# snippets/vprodcrm-ssl.conf is shared with app.vprodcrm.ru (one certificate for both),
# so it lives on the server only and is not ours to change.

server {
    listen 80;
    listen [::]:80;
    server_name vprodcrm.ru;
    server_tokens off;

    # Let's Encrypt HTTP-01 challenge, needed for certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vprodcrm.ru;
    include snippets/vprodcrm-ssl.conf;

    # Hide the nginx version in the Server header and on error pages
    server_tokens off;

    # Security headers. nginx drops server-level add_header in any location that has
    # its own add_header, so keep all of them here and none inside locations.
    # No includeSubDomains: subdomains belong to the app and decide for themselves.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # The page is static: no nonces, so inline scripts and styles stay allowed.
    # Google Fonts serves the font CSS and the font files.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    root /var/www/vprodcrm.ru;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
